[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lsgrand-decisive-pivot-gate"
version = "1.1.0"
description = "Falsification-first decisive pivot gate for Latent-State GRAND"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<3",
  "scipy>=1.10,<2",
  "pandas>=2.0,<3",
  "matplotlib>=3.7,<4",
]

[tool.setuptools.packages.find]
where = ["src"]

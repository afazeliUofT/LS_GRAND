[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lsgrand-field-gate"
version = "1.0.0"
description = "Falsification-first field-potential gate for Latent-State GRAND"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<3",
  "scipy>=1.10,<2",
  "pandas>=2.0,<3",
  "matplotlib>=3.7,<4",
]

[project.scripts]
lsgrand-gate = "lsgrand.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

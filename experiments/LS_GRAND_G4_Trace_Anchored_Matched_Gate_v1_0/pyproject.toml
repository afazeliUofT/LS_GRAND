[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lsgrand-g4-trace-gate"
version = "1.0.0"
description = "Trace-anchored final matched gate for event-triggered approximate LS-GRAND"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<3",
  "scipy>=1.10,<2",
  "pandas>=2.0,<3",
  "matplotlib>=3.7,<4"
]

[project.scripts]
lsgrand-g4 = "lsgrand_g4.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
